<section class="pagehead">
  <div class="wrap">
    <h1>Checkout</h1>
    <p class="crumb"><a href="index.html">Home</a> / <a href="cart.html">Shopping Cart</a> / <b>Checkout</b></p>
  </div>
</section>

<section class="section">
  <div class="wrap cart-layout">
    <div>
      <h3 style="margin-bottom:22px">Select Payment Method</h3>
      <p style="font-size:13px;margin-bottom:18px">Available payment methods will be confirmed once the payment gateway is finalised.</p>

      <label class="paymethod"><input type="radio" name="pay" checked/> <b class="pm-logo pm-logo--card"><span class="material-symbols-outlined" style="font-size:16px">credit_card</span></b> Card Payment</label>
      <label class="paymethod"><input type="radio" name="pay"/> <b class="pm-logo pm-logo--cod"><span class="material-symbols-outlined" style="font-size:16px">account_balance</span></b> Bank Transfer</label>

      <div class="paymethod paymethod--card">
        <label class="paymethod__head"><input type="radio" name="pay"/> <b class="pm-logo pm-logo--card"><span class="material-symbols-outlined" style="font-size:16px">add_card</span></b> Add New Card</label>
        <div class="paymethod__body">
          <div class="field"><label>Card Holder Name <span class="req">*</span></label><input class="input" placeholder="Name on card"/></div>
          <div class="field"><label>Card Number <span class="req">*</span></label><input class="input" placeholder="Card number"/></div>
          <div class="row2">
            <div class="field"><label>Expiry Date <span class="req">*</span></label><input class="input" placeholder="MM/YY"/></div>
            <div class="field"><label>CVV <span class="req">*</span></label><input class="input" placeholder="CVV"/></div>
          </div>
          <label class="check"><input type="checkbox"/> Save card for future payments</label>
          <button class="btn btn--primary" style="margin-top:12px">Add Card</button>
        </div>
      </div>
    </div>

    <aside class="summary">
      <h3>Order Summary</h3>
      <dl>
        <div><dt>Items</dt><dd>3</dd></div>
        <div><dt>Sub Total</dt><dd>R___</dd></div>
        <div><dt>Shipping</dt><dd>R___</dd></div>
        <div><dt>Coupon Discount</dt><dd>R___</dd></div>
      </dl>
      <div class="summary__total"><span>Total</span><b>R___</b></div>
      <a class="btn btn--primary btn--block" href="order-completed.html">Confirm Payment</a>
    </aside>
  </div>
</section>
