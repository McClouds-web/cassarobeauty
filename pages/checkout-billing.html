<section class="pagehead">
  <div class="wrap">
    <h1>Checkout</h1>
    <p class="crumb"><a href="index.html">Home</a> / <a href="cart.html">Shopping Cart</a> / <b>Checkout</b></p>
  </div>
</section>

<section class="section">
  <div class="wrap cart-layout">
    <form data-checkout-form>
      <h3 style="margin-bottom:22px">Delivery Details</h3>
      <div class="row2">
        <div class="field"><label>First Name <span class="req">*</span></label><input class="input" name="firstName" placeholder="First name" required/></div>
        <div class="field"><label>Last Name <span class="req">*</span></label><input class="input" name="lastName" placeholder="Last name" required/></div>
      </div>
      <div class="field"><label>Company Name (Optional)</label><input class="input" name="company" placeholder="Company name"/></div>
      <div class="field"><label>Country <span class="req">*</span></label>
        <select class="input" name="country" required><option value="">Select Country</option><option selected>South Africa</option></select>
      </div>
      <div class="field"><label>Street Address <span class="req">*</span></label><input class="input" name="street" placeholder="Street address" required/></div>
      <div class="field"><label>City / Suburb <span class="req">*</span></label><input class="input" name="city" placeholder="City or suburb" required/></div>
      <div class="field"><label>Province <span class="req">*</span></label>
        <select class="input" name="province" required>
          <option value="">Select Province</option>
          <option>Eastern Cape</option><option>Free State</option><option>Gauteng</option>
          <option>KwaZulu-Natal</option><option>Limpopo</option><option>Mpumalanga</option>
          <option>Northern Cape</option><option>North West</option><option>Western Cape</option>
        </select>
      </div>
      <div class="field"><label>Postal Code <span class="req">*</span></label><input class="input" name="postal" placeholder="Postal code" required/></div>
      <div class="field"><label>Phone <span class="req">*</span></label><input class="input" name="phone" type="tel" placeholder="Phone number" required/></div>
      <div class="field"><label>Email <span class="req">*</span></label><input class="input" name="email" type="email" placeholder="Email address" required/></div>
      <div class="field">
        <label>Delivery Address <span class="req">*</span></label>
        <div class="radios">
          <label class="radio"><input type="radio" name="deliverySame" value="same" checked/> Same as the address above</label>
          <label class="radio"><input type="radio" name="deliverySame" value="different"/> I will confirm a different delivery address on WhatsApp</label>
        </div>
      </div>
      <div class="field"><label>Order Notes (Optional)</label><input class="input" name="notes" placeholder="Anything our team should know about this order"/></div>
      <button class="btn btn--primary" type="submit" hidden>Continue</button>
    </form>

    <aside class="summary">
      <h3>Order Summary</h3>
      <dl>
        <div><dt>Items</dt><dd data-sum-items>0</dd></div>
        <div><dt>Sub Total</dt><dd data-sum-subtotal>R___</dd></div>
        <div><dt>Delivery</dt><dd>To be confirmed</dd></div>
        <div><dt>Payment</dt><dd>Bank Transfer / EFT</dd></div>
      </dl>
      <div class="summary__total"><span>Total</span><b data-sum-total>R___</b></div>
      <a class="btn btn--primary btn--block" href="checkout-payment.html" data-checkout-continue>Continue to Review</a>
      <p style="font-size:12px;color:var(--muted);margin-top:14px">Your details are only used to prepare the order message you send us on WhatsApp.</p>
    </aside>
  </div>
</section>
