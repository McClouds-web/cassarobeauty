<section class="pagehead">
  <div class="wrap">
    <h1>Checkout</h1>
    <p class="crumb"><a href="index.html">Home</a> / <a href="cart.html">Shopping Cart</a> / <b>Checkout</b></p>
  </div>
</section>

<section class="section">
  <div class="wrap cart-layout">
    <form onsubmit="event.preventDefault();location.href='checkout-payment.html'">
      <h3 style="margin-bottom:22px">Billing Details</h3>
      <div class="row2">
        <div class="field"><label>First Name <span class="req">*</span></label><input class="input" placeholder="First name" required/></div>
        <div class="field"><label>Last Name <span class="req">*</span></label><input class="input" placeholder="Last name" required/></div>
      </div>
      <div class="field"><label>Company Name (Optional)</label><input class="input" placeholder="Company name"/></div>
      <div class="field"><label>Country <span class="req">*</span></label>
        <select class="input" required><option value="">Select Country</option><option selected>South Africa</option></select>
      </div>
      <div class="field"><label>Street Address <span class="req">*</span></label><input class="input" placeholder="Street address" required/></div>
      <div class="field"><label>City <span class="req">*</span></label><input class="input" placeholder="City" required/></div>
      <div class="field"><label>Province <span class="req">*</span></label>
        <select class="input" required>
          <option value="">Select Province</option>
          <option>Eastern Cape</option><option>Free State</option><option>Gauteng</option>
          <option>KwaZulu-Natal</option><option>Limpopo</option><option>Mpumalanga</option>
          <option>Northern Cape</option><option>North West</option><option>Western Cape</option>
        </select>
      </div>
      <div class="field"><label>Postal Code <span class="req">*</span></label><input class="input" placeholder="Postal code" required/></div>
      <div class="field"><label>Phone <span class="req">*</span></label><input class="input" placeholder="Phone number" required/></div>
      <div class="field"><label>Email <span class="req">*</span></label><input class="input" type="email" placeholder="Email address" required/></div>
      <div class="field">
        <label>Delivery Address <span class="req">*</span></label>
        <div class="radios">
          <label class="radio"><input type="radio" name="addr" checked/> Same as billing address</label>
          <label class="radio"><input type="radio" name="addr"/> Use a different delivery address</label>
        </div>
      </div>
      <button class="btn btn--primary" type="submit" hidden>Continue</button>
    </form>

    <aside class="summary">
      <h3>Order Summary</h3>
      <dl>
        <div><dt>Items</dt><dd>3</dd></div>
        <div><dt>Sub Total</dt><dd>R___</dd></div>
        <div><dt>Shipping</dt><dd>Calculated at next step</dd></div>
        <div><dt>Coupon Discount</dt><dd>R___</dd></div>
      </dl>
      <div class="summary__total"><span>Total</span><b>R___</b></div>
      <a class="btn btn--primary btn--block" href="checkout-payment.html">Proceed to Payment</a>
    </aside>
  </div>
</section>
