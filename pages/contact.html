<section class="pagehead pagehead--cover">
  {{PH|Skincare Cover Image|pagehead__bg}}
  <div class="wrap">
    <h1>Contact Us</h1>
    <p class="crumb"><a href="index.html">Home</a> / <b>Contact</b></p>
  </div>
</section>

{{MARQUEE}}

<section class="section">
  <div class="wrap contact-layout">
    <form data-contact-form>
      <div class="row2">
        <div class="field"><label for="first-name">First Name<span class="req">*</span></label><input class="input" name="firstName" autocomplete="given-name" placeholder="First name" required id="first-name"/></div>
        <div class="field"><label for="last-name">Last Name<span class="req">*</span></label><input class="input" name="lastName" autocomplete="family-name" placeholder="Last name" required id="last-name"/></div>
      </div>
      <div class="row2">
        <div class="field"><label for="email">Email<span class="req">*</span></label><input class="input" name="email" autocomplete="email" type="email" placeholder="Email address" required id="email"/></div>
        <div class="field"><label for="phone">Phone<span class="req">*</span></label><input class="input" name="phone" autocomplete="tel" placeholder="Phone number" required id="phone"/></div>
      </div>
      <div class="field"><label for="subject">Subject<span class="req">*</span></label><input class="input" name="subject"  placeholder="Subject" required id="subject"/></div>
      <div class="field"><label for="your-message">Your Message<span class="req">*</span></label><textarea class="input" name="message" placeholder="How can we help?" required id="your-message"></textarea></div>
      <p class="hp" aria-hidden="true"><label>Leave this field empty<input type="text" name="website" tabindex="-1" autocomplete="off"/></label></p>
      <button class="btn btn--primary" type="submit">Send a Message</button>
    </form>
    <div class="contact-photo">{{PH|Contact Page Image}}</div>
  </div>

  <div class="wrap" style="margin-top:44px">
    <div class="grid grid--3">
      <div class="infocard"><span class="infocard__ico material-symbols-outlined">location_on</span><strong>Location</strong><small>South Africa</small></div>
      <div class="infocard"><span class="infocard__ico material-symbols-outlined">call</span><strong>Phone</strong><small><a href="tel:+{{WA_NUMBER}}">{{WA_DISPLAY}}</a></small></div>
      <div class="infocard"><span class="infocard__ico material-symbols-outlined">mail</span><strong>Email</strong><small><a href="mailto:cassarobeauty.za@gmail.com">cassarobeauty.za@gmail.com</a></small></div>
    </div>
  </div>
</section>
