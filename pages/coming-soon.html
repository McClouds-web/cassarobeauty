<section class="section center" style="padding:90px 0">
  <div class="wrap">
    <h1 style="margin-bottom:14px">Coming <span class="gold">Soon</span></h1>
    <p style="margin-bottom:30px">Our online store is launching soon. <br/>Subscribe to be the first to know when we open.</p>
    <form class="subscribe" data-subscribe-form>
      <label class="sr-only" for="coming-soon-email">Email address</label>
      <input id="coming-soon-email" name="email" type="email" placeholder="Enter Email Address" autocomplete="email" required/>
      <p class="hp" aria-hidden="true"><label>Leave this field empty<input type="text" name="website" tabindex="-1" autocomplete="off"/></label></p>
      <button class="btn btn--primary" type="submit">Notify Me</button>
    </form>
  </div>
</section>
