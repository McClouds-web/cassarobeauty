<section class="pagehead pagehead--cover pagehead--cover-bottom">
  {{PH|Brands Cover Image|pagehead__bg}}
</section>

<section class="section">
  <div class="wrap">
    <table class="linetable" data-wish-table>
      <thead><tr><th>Product</th><th>Price</th><th>Stock Status</th><th></th></tr></thead>
      <tbody data-wish-rows></tbody>
    </table>

    <div class="emptystate" data-wish-empty hidden>
      <span class="ico material-symbols-outlined">favorite</span>
      <h3>Your wishlist is empty</h3>
      <p>Tap the heart on any product to save it here for later.</p>
      <a class="btn btn--primary" href="shop.html">Browse Products</a>
    </div>

    <div class="cart-actions" data-wish-tools>
      <a class="link-underline gold" href="wishlist.html" data-wish-clear>Clear Wishlist</a>
      <span style="margin-left:auto"></span>
      <a class="btn btn--primary" href="cart.html" data-wish-add-all>Add All to Cart</a>
    </div>
  </div>
</section>
